services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: contatos_test_db
      MYSQL_USER: contatos_test_user
      MYSQL_PASSWORD: test_password
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tests:
    build: .
    command: npm test
    environment:
      NODE_ENV: test
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_USER: contatos_test_user
      DB_PASSWORD: test_password
      DB_NAME: contatos_test_db
    depends_on:
      mysql-test:
        condition: service_healthy